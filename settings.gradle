rootProject.name = 'adf-sample-agent-java'

// Build against the Java-17 source snapshots supplied with the competition,
// not the online master branches (which have since moved to Java 21). The
// snapshots may be copied into this checkout or kept beside it, as in the
// original sample-agent layout.
def suppliedDependency = { String name ->
  file(name).exists() ? name : "../${name}"
}

includeBuild(suppliedDependency('rcrs-server-master')) {
  dependencySubstitution {
    substitute module('com.github.roborescue:rcrs-server') using project(':')
  }
}
includeBuild(suppliedDependency('adf-core-java-master')) {
  dependencySubstitution {
    substitute module('com.github.roborescue:adf-core-java') using project(':')
  }
}
